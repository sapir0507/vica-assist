<input
  #imageUpload
  id="hotel-images"
  class="file-input"
  type="file"
  accept=".jpg,.svg,.png,.jpeg"
  multiple
  (change)="onUpload($event)"
/>

<div class="file-upload">
  <button mat-stroked-button type="button" (click)="imageUpload.click()">
    <mat-icon svgIcon="attach_file" aria-hidden="true"></mat-icon>
    Choose photos
  </button>
  <span class="file-upload__name" aria-live="polite">{{ fileName || 'No photos chosen yet' }}</span>
</div>
