
@if (item_type == ItemType.Flight && flight) {
  <div>
    <flight-item
      [flight]="flight"
      [order]="order"
      (chosenFlight)="onChosenFlight($event)"
    ></flight-item>
  </div>
}

@if (item_type == ItemType.Hotel && hotel) {
  <div>
    <hotel-item
      [hotel]="hotel"
      [order]="order"
      (chosenHotel)="onChosenHotel($event)"
    ></hotel-item>
  </div>
}
