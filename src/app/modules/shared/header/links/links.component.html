<ul class="links" [class.links--bar]="!isSideBar" [class.links--list]="isSideBar">
  @for (link of currentLinks; track link.name) {
    <li>
      @if (isLogout && link.name === 'Logout') {
        <a class="link" href="#" (click)="onLogout($event)">Logout</a>
      } @else {
        <a
          class="link"
          [routerLink]="link.link"
          routerLinkActive="is-active"
          [routerLinkActiveOptions]="{ exact: true }"
          >{{ link.name }}</a
        >
      }
    </li>
  }
</ul>
