<div class="site-header">
  <div class="site-header__inner">
    <a class="brand" routerLink="/homepage" aria-label="vica-assist, go to the homepage">
      <mat-icon class="brand__icon" svgIcon="flight_takeoff" aria-hidden="true"></mat-icon>
      <span class="brand__name">vica-assist</span>
    </a>
    <nav aria-label="Main">
      @if (linkStore.sharedLinks()) {
        <app-links
          [currentLinks]="linkStore.sharedLinks()"
          [isDropDown]="false"
          [isSideBar]="false"
          [isLogout]="sessionStore.isLoggedIn()"
        ></app-links>
      }
    </nav>
  </div>
</div>
