<div class="site-header">
  <div class="site-header__inner">
    <a class="brand" routerLink="/homepage" aria-label="vica-assist, go to the homepage">
      <mat-icon class="brand__icon" svgIcon="flight_takeoff" aria-hidden="true"></mat-icon>
      <span class="brand__name">vica-assist</span>
    </a>
    <button type="button" class="menu-button" aria-label="Open menu" (click)="openSidebar(sidebar)">
      <mat-icon svgIcon="menu" aria-hidden="true"></mat-icon>
    </button>
  </div>
</div>

<ng-template #sidebar let-offcanvas>
  <div class="offcanvas-header">
    <h5 class="offcanvas-title" id="offcanvasNavbarLabel">vica-assist</h5>
    <button type="button" class="btn-close" aria-label="Close menu" (click)="offcanvas.dismiss()"></button>
  </div>
  <div class="offcanvas-body">
    <nav aria-label="Main">
      @if (linkStore.sharedLinks()) {
        <app-links
          [currentLinks]="linkStore.sharedLinks()"
          [isDropDown]="false"
          [isSideBar]="true"
          [isLogout]="sessionStore.isLoggedIn()"
        ></app-links>
      }
      @if (linkStore.customersLinks().length) {
        <hr class="menu-divider">
        <app-dropdown
          [currentLinks]="linkStore.customersLinks()"
          [isDropDown]="true"
          [isSideBar]="true"
          [title]="'customers'"
        ></app-dropdown>
      }
      @if (linkStore.agentLinks()) {
        <hr class="menu-divider">
        <app-dropdown
          [currentLinks]="linkStore.agentLinks()"
          [isDropDown]="true"
          [isSideBar]="true"
          [title]="'agents'"
        ></app-dropdown>
      }
    </nav>
  </div>
</ng-template>
