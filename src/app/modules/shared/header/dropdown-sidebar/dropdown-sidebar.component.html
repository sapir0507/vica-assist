<nav class="navbar navbar-dark bg-dark">
  <div class="container-fluid">
    <div class="logo">
      <a class="navbar-brand" href="#">✈  vica-assist</a>
    </div>
    <div class="my-flex-2">
      <div class="row">
        <div class="col">
          @if (linkStore.sharedLinks()) {
            <app-links 
              [currentLinks]="linkStore.sharedLinks()" 
              [isDropDown]="false" 
              [isSideBar]="false" 
              [isLogout]="sessionStore.isLoggedIn()">
            </app-links>
          }
      </div>
    </div>

    <button class="navbar-toggler" type="button" aria-label="Open menu" (click)="openSidebar(sidebar)">
      <span class="navbar-toggler-icon"></span>
    </button>
  </div>
</div>
</nav>

<ng-template #sidebar let-offcanvas>
  <div class="offcanvas-header">
    <h5 class="offcanvas-title" id="offcanvasNavbarLabel">vica-assist</h5>
    <button type="button" class="btn-close btn-close-white" aria-label="Close" (click)="offcanvas.dismiss()"></button>
  </div>
  <div class="offcanvas-body">
    <ul class="navbar-nav justify-content-end flex-grow-1 pe-3">
      @if (linkStore.sharedLinks()) {
        <app-links 
          [currentLinks]="linkStore.sharedLinks()" 
          [isDropDown]="false" 
          [isSideBar]="true">
        </app-links>
      }
      @if(linkStore.customersLinks()) {
        <li>
          <hr class="dropdown-divider">
        </li>
        <app-dropdown 
          [currentLinks]="linkStore.customersLinks()" 
          [isDropDown]="true" 
          [isSideBar]="true" 
          [title]="'customers'">
        </app-dropdown>
      }
      @if (linkStore.agentLinks()) {
        <li>
          <hr class="dropdown-divider">
        </li>
        <app-dropdown 
          [currentLinks]="linkStore.agentLinks()" 
          [isDropDown]="true" 
          [isSideBar]="true" 
          [title]="'agents'">
        </app-dropdown>
      }
    </ul>
  </div>
</ng-template>
