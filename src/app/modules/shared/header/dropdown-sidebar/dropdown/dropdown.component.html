@if (currentLinks) {
  <div ngbDropdown display="static">
    <button type="button" class="group-toggle" ngbDropdownToggle>
      {{title}}
    </button>
    <ul class="group-menu" ngbDropdownMenu>
      <li>
        <app-links
          [currentLinks]="currentLinks"
          [isSideBar]="isSideBar"
          [isDropDown]="isDropDown"
        ></app-links>
      </li>
    </ul>
  </div>
}
