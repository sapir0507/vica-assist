@if (currentLinks) {
  <li class="nav-item" ngbDropdown display="static">
    <button type="button" class="nav-link" ngbDropdownToggle>
      {{title}}
    </button>
    <ul class="ddm-bc ddm-s" ngbDropdownMenu>
      <li>
        <app-links
          [currentLinks]="currentLinks"
          [isSideBar]="isSideBar"
          [isDropDown]="isDropDown"
        ></app-links>
      </li>
    </ul>
  </li>
}
