@if (readonly()) {
  <span class="stars" role="img" [attr.aria-label]="label() + ': ' + (value() ?? 0) + ' of 5 stars'">
    @for (star of stars; track star) {
      <mat-icon class="stars__star" [class.stars__star--on]="star <= (value() ?? 0)" svgIcon="star" aria-hidden="true"></mat-icon>
    }
  </span>
} @else {
  <div class="stars" role="radiogroup" [attr.aria-label]="label()">
    @for (star of stars; track star) {
      <button
        type="button"
        class="stars__button"
        role="radio"
        [attr.aria-checked]="value() === star"
        [attr.aria-label]="star + (star === 1 ? ' star' : ' stars')"
        [tabindex]="isTabStop(star) ? 0 : -1"
        (click)="select(star)"
        (keydown)="onKeydown($event)"
      >
        <mat-icon class="stars__star" [class.stars__star--on]="star <= (value() ?? 0)" svgIcon="star" aria-hidden="true"></mat-icon>
      </button>
    }
  </div>
}
