<div class="page">
  <h1 class="page__title">Customer orders</h1>
  <p class="page__subtitle">Open an order, add flights and hotels for the customer, then mark it as finished.</p>

  <div class="navigator">
    <button mat-icon-button type="button" aria-label="Previous order" (click)="chosenIDPrev()">
      <mat-icon svgIcon="arrow_circle_left" aria-hidden="true"></mat-icon>
    </button>
    <ordersList
      class="navigator__card"
      [requestID]="nextID"
      [status]="'agent'"
      (item)="onChosen2($event)"
      (maxIDs)="onGetMaxIDs($event)"
    ></ordersList>
    <button mat-icon-button type="button" aria-label="Next order" (click)="chosenIDNext()">
      <mat-icon svgIcon="arrow_circle_right" aria-hidden="true"></mat-icon>
    </button>
  </div>

  @if (orderID) {
    <div class="workspace">
      <userRequest-preview [orderID]="chosenID"></userRequest-preview>

      <section class="workspace__forms" aria-label="Flights and hotels for this order">
        <div class="segmented" role="group" aria-label="What to add">
          <button
            type="button"
            class="segmented__option"
            [class.segmented__option--active]="step === 'flight'"
            [attr.aria-pressed]="step === 'flight'"
            (click)="showStep('flight')"
          >Flights</button>
          <button
            type="button"
            class="segmented__option"
            [class.segmented__option--active]="step === 'hotel'"
            [attr.aria-pressed]="step === 'hotel'"
            (click)="showStep('hotel')"
          >Hotels</button>
        </div>

        @if (step === 'flight') {
          <lib-myFlights [orderID]="orderID" [order]="order"></lib-myFlights>
        } @else {
          <my-hotels [orderID]="orderID"></my-hotels>
        }

        <div class="workspace__actions">
          <button mat-flat-button type="button" (click)="updateState()">Set order as finished</button>
        </div>
      </section>
    </div>
  }
</div>
