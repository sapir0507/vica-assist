<!-- <div class="container-fluid p-2"> -->
<div class="container px-xxl-1 justify-content-center">
  <div class="row">
    <div class="col">
      <h2 class="text-center">Pending Orders</h2>
      <div class="border bg-light orderList">
        <span class="arrows" (click)="chosenIDPrev()"><mat-icon class="inline-icon icon-xl" svgIcon="arrow_circle_left" aria-hidden="true"></mat-icon></span>
        <div class="oList">
          <ordersList
            [requestID]="nextID"
            [status]="'agent'"
            (item)="onChosen2($event)"
            (maxIDs)="onGetMaxIDs($event)"
          ></ordersList>
        </div>
        <span class="arrows" (click)="chosenIDNext()"><mat-icon class="inline-icon icon-xl" svgIcon="arrow_circle_right" aria-hidden="true"></mat-icon></span>
      </div>
    </div>
  </div>
</div>

@if (orderID) {
  <div class="container">
    <div class="myGrid mt-4">
      <!-- <div class="col"> -->
      <div class="userRequest container mt-2">
        <userRequest-preview
          [orderID]="chosenID"
        ></userRequest-preview>
      </div>
    <!-- </div> -->
    <!-- <div class="col"> -->
    <div class="RightTile container">
      @if (step==='flight') {
        <lib-myFlights [orderID]="orderID" [order]="order"></lib-myFlights>
        <div class="toTheLeft">
          <button mat-raised-button class="btn btn-link" color="primary" type="button" (click)="updateState()">
            SET ORDER AS FINISHED
          </button>
          <button mat-raised-button class="btn btn-link" color="primary" type="button" (click)="onClick()">Next</button>
        </div>
      } @else {
        @if (step==='hotel') {
          <div>
            <my-hotels [orderID]="orderID"></my-hotels>
            <div class="toTheLeft">
              <button mat-raised-button class="btn btn-link mt-5" color="primary" type="button" (click)="updateState()">
                SET ORDER AS FINISHED
              </button>
              <button mat-raised-button class="btn btn-link mt-5" color="primary" type="button" (click)="onClick()">Back</button>
            </div>
          </div>
        }
      }
      <div>
      </div>
    </div>
  <!-- </div> -->
</div>
</div>
}
<!-- </div> -->
