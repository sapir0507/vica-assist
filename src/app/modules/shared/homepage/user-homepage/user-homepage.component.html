
<div class="contrainer">
  <div class="text-center">
    <h1 [ngClass]="getTitleClasses()" (window:resize)="handleFontSizeEvent($event)">Homepage</h1>
  </div>
  @if (getChoice() === 0) {
    <div class="choices m-5">
      <mat-grid-list [cols]="breakpoint" rowHeight="2:1" [gutterSize]="'20px'" (window:resize)="handleSizeEvent($event)">
        <mat-grid-tile>
          <button mat-raised-button color="primary" (click)="newOrder()">
            Place A New Order
          </button>
        </mat-grid-tile>
        <mat-grid-tile>
          <button mat-raised-button color="primary" (click)="seeAllOrders()">
            Monitor Previous Orders
          </button>
        </mat-grid-tile>
      </mat-grid-list>
    </div>
  }
  @if (getChoice() === 1) {
    <div class="choices">
      <div class="goBack m-4">
        <button mat-button (click)="goBack()">
          <span class="fa fa-arrow-alt-circle-left"></span>
          &nbsp;Go Back
        </button>
      </div>
      <div class="container-fluid m-2">
        <userRequests></userRequests>
      </div>
    </div>
  }
  @if (getChoice() === 2) {
    <div class="choices">
      <div class="goBack m-4">
        <button mat-button (click)="goBack()">
          <span class="fa fa-arrow-alt-circle-left"></span>
          &nbsp;Go Back
        </button>
        <mat-tab-group animationDuration="0ms" [backgroundColor]="'primary'">
          <mat-tab label="Pending Orders">
            <order-status-list status="pending" (item)="selectedItem($event)"></order-status-list>
          </mat-tab>
          <mat-tab label="Finished Orders">
            <order-status-list status="finished" (item)="selectedItem($event)"></order-status-list>
          </mat-tab>
        </mat-tab-group>
      </div>
    </div>
  }
</div>
