<div class="page">
  @switch (view) {
    @case ('menu') {
      <h1 class="page__title">Where to next?</h1>
      <p class="page__subtitle">Book a new trip or follow the orders you already placed.</p>
      <div class="actions">
        <button type="button" class="action-card" (click)="showBooking()">
          <mat-icon class="action-card__icon" svgIcon="luggage" aria-hidden="true"></mat-icon>
          <span class="action-card__title">Book your trip</span>
          <span class="action-card__text">Pick a destination and tell us your dates and budget.</span>
        </button>
        <button type="button" class="action-card" (click)="showOrders()">
          <mat-icon class="action-card__icon" svgIcon="calendar_today" aria-hidden="true"></mat-icon>
          <span class="action-card__title">Manage bookings</span>
          <span class="action-card__text">See which orders are pending and which are ready.</span>
        </button>
      </div>
    }
    @case ('booking') {
      <button mat-button class="back" type="button" (click)="showMenu()">
        <mat-icon svgIcon="arrow_circle_left" aria-hidden="true"></mat-icon>
        Back
      </button>
      <userRequests></userRequests>
    }
    @case ('orders') {
      <button mat-button class="back" type="button" (click)="showMenu()">
        <mat-icon svgIcon="arrow_circle_left" aria-hidden="true"></mat-icon>
        Back
      </button>
      <h1 class="page__title">Your bookings</h1>
      <mat-tab-group animationDuration="0ms">
        <mat-tab label="Waiting for agent">
          <order-status-list status="pending" (item)="selectedItem($event)"></order-status-list>
        </mat-tab>
        <mat-tab label="Ready to choose">
          <order-status-list status="finished" (item)="selectedItem($event)"></order-status-list>
        </mat-tab>
        <mat-tab label="Booked">
          <booked-list></booked-list>
        </mat-tab>
      </mat-tab-group>
    }
  }
</div>
