@if (orders()?.length) {
  <div class="order-grid">
    @for (item of orders(); track item.id) {
      <order-list-item [currentItem]="item" [showOffers]="status === 'finished'" [trackLink]="true" (item)="selectedItem($event)"></order-list-item>
    }
  </div>
} @else {
  <div class="empty-state">
    <span class="empty-state__icon" aria-hidden="true"><mat-icon svgIcon="flight_takeoff"></mat-icon></span>
    <p class="empty-state__text">{{ status === 'pending' ? 'No requests are waiting for an agent.' : 'No agent answers to choose from yet.' }}</p>
    <a mat-raised-button color="primary" routerLink="/homepage/book">
      Book your trip
      <mat-icon iconPositionEnd svgIcon="arrow_forward" aria-hidden="true"></mat-icon>
    </a>
  </div>
}
