<section class="page">
  <h1 class="page__title">Choose your hotel and flight</h1>
  <p class="page__subtitle">Pick one of each from the options your agent added to this order.</p>

  <mat-tab-group>
    <mat-tab label="Hotel">
      <app-choose-hotel
        (chosenHotel)="onChosenHotel($event)"
        [orderID]="myParam"
        [order]="finalOrderStore.order()"
      ></app-choose-hotel>
    </mat-tab>
    <mat-tab label="Flight">
      <app-choose-flight
        (chosenFlight)="onChosenFlight($event)"
        [orderID]="myParam"
        [order]="finalOrderStore.order()"
      ></app-choose-flight>
    </mat-tab>
  </mat-tab-group>
</section>
