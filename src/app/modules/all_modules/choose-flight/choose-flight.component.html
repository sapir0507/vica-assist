@if (_ALLFlights$ | async) {
  <div class="container-fluid">
    @for (flight of _ALLFlights$ | async; track flight.id) {
      <div>
        <div class="choose-flights container-fluid">
          <item
            class="container-fluid flight-item"
            (chosenFlight)="onChosenFlight($event)"
            [item_type]="ItemType.Flight"
            [flight]="flight">
          </item>
          <!-- <button class="">Final Choice</button> -->
        </div>
      </div>
    }
  </div>
}
