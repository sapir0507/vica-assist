@if (_ALLFlights$ | async; as flights) {
  <div class="choice-grid">
    @for (flight of flights; track flight.id) {
      <item
        [item_type]="ItemType.Flight"
        [flight]="flight"
        (chosenFlight)="onChosenFlight($event)"
      ></item>
    } @empty {
      <p class="choice-grid__empty">No flights have been added for this order yet.</p>
    }
  </div>
}
