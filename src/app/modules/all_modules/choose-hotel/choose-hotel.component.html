@if (_allHotels$ | async; as hotels) {
  <div class="choice-grid">
    @for (hotel of hotels; track hotel.id) {
      <item
        [item_type]="ItemType.Hotel"
        [hotel]="hotel"
        [order]="order"
        (chosenHotel)="onChooseHotel($event)"
      ></item>
    } @empty {
      <p class="choice-grid__empty">No hotels have been added for this order yet.</p>
    }
  </div>
}
